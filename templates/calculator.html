<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <h1>Площадь комнаты</h1>
    <form method="POST">
        <input type="number" step="any" name="length" placeholder="Длина" required>
        <input type="number" step="any" name="width" placeholder="Ширина" required>
        <button>Посчитать</button>
    </form>
    {% if area is not none %}<h2>{{ area }} м²</h2>{% endif %}
    <p>{{ message }}</p>
    <a href="/">На главную</a>
</main>
</body>
</html>
